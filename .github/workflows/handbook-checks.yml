name: Handbook checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, retired terms, placeholders, and review dates
        run: python3 .github/scripts/check_handbook.py
